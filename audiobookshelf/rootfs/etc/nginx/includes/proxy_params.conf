proxy_http_version          1.1;
proxy_ignore_client_abort   off;
proxy_read_timeout          86400s;
proxy_send_timeout          86400s;
proxy_max_temp_file_size    0;

# Audio is streamed straight through, and so are the downloads of whole
# audiobooks. Buffering them would put a large file through a copy on disk
# before any of it reached the player.
proxy_buffering             off;

# Responses have to arrive uncompressed, or the Ingress rewrites would be
# looking at gzip rather than at the page. Nothing is lost by it: Audiobookshelf
# serves the client without compressing it, and NGINX compresses on the way out.
proxy_set_header Accept-Encoding "";

# Progress, playback and library updates all arrive over a socket.io
# connection, which starts life as an HTTP request asking to be upgraded.
proxy_set_header Connection $connection_upgrade;
proxy_set_header Upgrade $http_upgrade;

# RSS feed and share addresses are built out of the address the request came in
# on, so it has to survive the proxy.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
